name: GameXR Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gamexr-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-candidate:
    name: Build candidate
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify browser and release contracts
        run: npm run check
      - name: Verify Apex contract
        run: npm run check:apex
      - name: Verify Swift, iOS, and visionOS adapters
        run: npm run native:check
      - name: Upload immutable candidate
        uses: actions/upload-artifact@v5
        with:
          name: gamexr-${{ github.sha }}
          path: dist/gamexr
          if-no-files-found: error
          retention-days: 7

  integration-gate:
    name: Integration Gate
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v6
      - name: Download immutable candidate
        uses: actions/download-artifact@v6
        with:
          name: gamexr-${{ github.sha }}
          path: dist/gamexr
      - name: Round-trip release manifest
        run: node scripts/check-release.mjs --root=dist/gamexr --base=/gamexr/
